services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - BATCH_CONCURRENCY=${BATCH_CONCURRENCY:-3}
      - MAX_BATCH_SIZE=${MAX_BATCH_SIZE:-25}
    volumes:
      - db_data:/data
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./auto_assessment/frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
